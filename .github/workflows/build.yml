name: Build

# This project is a native Android app (Kotlin + Jetpack Compose) whose WhatsApp
# transport is a Go/`whatsmeow` library bound with `gomobile`. The generated
# `app/libs/wagateway.aar` is produced here instead of being committed, because it
# is a large binary artifact that must be rebuilt whenever `go-wagateway/**` changes.
#
# Jobs:
#   gateway-aar : builds the Go binding  -> app/libs/wagateway.aar
#   android     : unit tests + debug APK (needs gateway-aar)
#   release     : signed APK + AAB + GitHub release, only for tags like v1.0.0

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-aar:
    name: Build wagateway.aar (Go + gomobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: go-wagateway/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "ndk;28.0.12674087"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Go module
        working-directory: go-wagateway
        run: go build ./...

      - name: Bind Android AAR
        working-directory: go-wagateway
        run: |
          gomobile init
          gomobile bind -target=android/arm64,android/amd64,android/arm -androidapi 24 -o ../app/libs/wagateway.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: wagateway-aar
          path: app/libs/wagateway.aar
          if-no-files-found: error
          retention-days: 30

  android:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    needs: gateway-aar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wagateway.aar
        uses: actions/download-artifact@v8
        with:
          name: wagateway-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Provisions the exact Gradle version from gradle/wrapper/gradle-wrapper.properties
          # (no gradle-wrapper.jar needs to be committed).
          gradle-version: wrapper

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wagateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: gateway-aar
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wagateway.aar
        uses: actions/download-artifact@v8
        with:
          name: wagateway-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the repository secrets KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD (plus KEY_ALIAS if your key alias is not 'upload') before tagging a release."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
