name: Build

# This project is a native Android app (Kotlin + Jetpack Compose) whose WhatsApp
# transport is a Go/`whatsmeow` library bound with `gomobile`. The generated
# `app/libs/wagateway.aar` is produced here instead of being committed, because it
# is a large binary artifact that must be rebuilt whenever `go-wagateway/**` changes.
#
# Jobs:
#   gateway-aar : builds the Go binding  -> app/libs/wagateway.aar (reusable: gateway-aar.yml)
#   android     : unit tests + debug APK (needs gateway-aar)
#   release     : signed APK + AAB + GitHub release, only for tags like v1.0.0
#
# A release-grade, R8-minified APK is built by the separate "Optimized APK" workflow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-aar:
    name: Build wagateway.aar (Go + gomobile)
    uses: ./.github/workflows/gateway-aar.yml

  android:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    needs: gateway-aar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wagateway.aar
        uses: actions/download-artifact@v8
        with:
          name: wagateway-aar
          path: app/libs

      # AGP only takes classes.jar out of a local .aar file dependency and ignores its jni/, so
      # the gateway's libgojni.so has to be unpacked where the jniLibs source set (see
      # app/build.gradle.kts) picks it up. Without this the APK installs, runs, and fails on the
      # first gateway call with UnsatisfiedLinkError: libgojni.so not found.
      - name: Unpack the AAR native libs
        run: |
          rm -rf app/libs/wagateway-jni
          unzip -o -q app/libs/wagateway.aar 'jni/*' -d app/libs/wagateway-jni
          find app/libs/wagateway-jni -name '*.so' -exec ls -la {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Provisions the exact Gradle version from gradle/wrapper/gradle-wrapper.properties
          # (no gradle-wrapper.jar needs to be committed).
          gradle-version: wrapper

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # app/libs/wagateway.aar is rewritten at the same path on every build while the runner
      # restores Gradle's cache. The AAR extract transform, the extracted jars and the build cache
      # may outlive the file they were computed from, and that is the one explanation found so far
      # for a method the Go binding does declare (and the step below confirms with javap) being
      # reported as "unresolved reference" during compileDebugKotlin. Dropping them is cheap
      # insurance: the compiler then sees the AAR this run built.
      - name: Drop cached AAR extraction
        run: |
          rm -rf "$HOME/.gradle/caches/transforms-"* || true
          rm -rf "$HOME/.gradle/caches"/*/transforms || true
          rm -rf "$HOME/.gradle/caches/jars-"* || true
          rm -rf "$HOME/.gradle/caches/build-cache-1" || true

      # Prints what the Kotlin compiler gets from the downloaded binding and fails fast when a
      # method the app calls is missing from the AAR. Without this the only symptom is a
      # confusing "unresolved reference" deep in compileDebugKotlin, which says nothing about
      # whether the Kotlin source or the Go binding is at fault. Keep the list in sync with the
      # methods WaGatewayManager calls.
      - name: Verify AAR binding
        run: |
          set -euo pipefail
          sha256sum app/libs/wagateway.aar
          ls -la app/libs
          unzip -p app/libs/wagateway.aar classes.jar > /tmp/wagateway-classes.jar
          javap -classpath /tmp/wagateway-classes.jar wagateway.Client | tee /tmp/wagateway-client.txt
          missing=0
          for method in sendText sendImage sendDocument sendAudio sendVideo downloadMedia \
                        markRead editText setTyping pairPhone logout resetSession; do
            if ! grep -q " $method(" /tmp/wagateway-client.txt; then
              echo "::error::wagateway.Client is missing $method(); the AAR does not match go-wagateway/**"
              missing=1
            fi
          done
          exit $missing

      - name: Unit tests
        # Incremental compilation reuses a cached ABI snapshot of the binding; after the AAR is
        # replaced that snapshot can hide methods that do exist in the new one.
        run: gradle testDebugUnitTest --no-daemon --stacktrace -Pkotlin.incremental=false --no-build-cache

      # Gradle only prints failing tests, so summarise the XML reports to make the
      # evidence visible in the log: which test classes ran and how many passed.
      - name: Unit test summary
        if: always()
        run: |
          REPORTS=app/build/test-results/testDebugUnitTest
          if ! ls "$REPORTS"/*.xml >/dev/null 2>&1; then
            echo "No test result XML found in $REPORTS"
            exit 0
          fi
          echo "=== Test classes ==="
          for f in "$REPORTS"/*.xml; do
            grep -o 'name="[^"]*"' "$f" | head -1
          done
          echo "=== Totals ==="
          grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$REPORTS"/*.xml |
            awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "tests=%d skipped=%d failures=%d errors=%d\n", t, s, f, e}'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # The app compiles and installs either way, so the built APK is the only trustworthy place
      # to check that the gateway can load at all. This is the regression guard for "the APK is
      # suspiciously small": an 18 MB debug APK means the ~26 MB-per-ABI libgojni.so is missing.
      - name: Assert the APK carries the gateway native library
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || true
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! unzip -l "$APK" | grep -q "lib/$abi/libgojni.so"; then
              echo "::error::$APK has no lib/$abi/libgojni.so; the WhatsApp gateway cannot load"
              missing=1
            fi
          done
          exit $missing

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wagateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: gateway-aar
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wagateway.aar
        uses: actions/download-artifact@v8
        with:
          name: wagateway-aar
          path: app/libs

      # Same reason as in the android job: a local .aar does not contribute its jni/ by itself.
      - name: Unpack the AAR native libs
        run: |
          rm -rf app/libs/wagateway-jni
          unzip -o -q app/libs/wagateway.aar 'jni/*' -d app/libs/wagateway-jni
          find app/libs/wagateway-jni -name '*.so' -exec ls -la {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the repository secrets KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD (plus KEY_ALIAS if your key alias is not 'upload') before tagging a release."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
