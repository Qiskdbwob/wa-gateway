name: Build wagateway.aar

on:
  push:
    branches: [main]
    paths:
      - 'go-wagateway/**'
      - '.github/workflows/build-aar.yml'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

     - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go-wagateway/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
        continue-on-error: true

      - name: Install gomobile + NDK
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.12674087" || true

      - name: Build AAR
         run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -o ../app/libs/wagateway.aar ./...
        working-directory: go-wagateway

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: wagateway-aar
          path: app/libs/wagateway.aar
          retention-days: 30
