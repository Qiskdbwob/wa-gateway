# Robolectric resolves an "android-all" jar for the requested sandbox SDK. Robolectric
# 4.16.x has no jar for API 36, and a missing jar fails the whole test class at
# initialization time with:
#
#   java.lang.UnsupportedOperationException at DefaultSdkProvider.java:170
#
# The app compiles and runs against API 36, but the *test sandbox* is pinned here to
# the highest level this Robolectric version supports. Individual tests may still
# override it with @Config(sdk = [...]).
sdk=34
