name: Gateway AAR (reusable)

# The Go/`whatsmeow` binding (`app/libs/wagateway.aar`) is a generated binary that must be rebuilt
# whenever `go-wagateway/**` changes. It used to live inside the Build workflow only; it is a
# reusable workflow now so "Build" and "Optimized APK" share one implementation instead of
# drifting apart (the gomobile bind targets and the NDK version are easy to get out of sync).
#
# Call it from a job:
#
#   jobs:
#     gateway-aar:
#       uses: ./.github/workflows/gateway-aar.yml
#
# The caller then pulls `app/libs/wagateway.aar` with actions/download-artifact (name
# `wagateway-aar`), because the artifact belongs to the caller's run.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build wagateway.aar (Go + gomobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: go-wagateway/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "ndk;28.0.12674087"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Go module
        working-directory: go-wagateway
        run: go build ./...

      - name: Bind Android AAR
        working-directory: go-wagateway
        run: |
          gomobile init
          gomobile bind -target=android/arm64,android/amd64,android/arm -androidapi 24 -o ../app/libs/wagateway.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: wagateway-aar
          path: app/libs/wagateway.aar
          if-no-files-found: error
          retention-days: 30
